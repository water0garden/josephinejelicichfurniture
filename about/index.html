  <script>
    function myFunction() {
      document.getElementById("myDropdown").classList.toggle("show");
    }

    // Optional: Close the dropdown if the user clicks outside of it
    window.onclick = function(event) {
      if (!event.target.matches('.dropbtn')) {
        var dropdowns = document.getElementsByClassName("dropdown-content");
        for (var i = 0; i < dropdowns.length; i++) {
          var openDropdown = dropdowns[i];
          if (openDropdown.classList.contains('show')) {
            openDropdown.classList.remove('show');
          }
        }
      }
    }
  </script>

  <script>
    const ARENA_CHANNEL_SLUG = "exhibitions-cv-press";

async function loadResumeLink() {
  const resumeBtn = document.getElementById("resumeBtn");

  try {
    const response = await fetch(
      `https://api.are.na/v2/channels/${ARENA_CHANNEL_SLUG}/contents`
    );

    if (!response.ok) {
      throw new Error(`API returned status ${response.status}`);
    }

    const data = await response.json();
    const blocks = Array.isArray(data) ? data : data.contents;

    // Find all PDF blocks, then take the most recently added one
    const pdfBlocks = blocks.filter(
      (block) => block.attachment?.content_type === "application/pdf"
    );

    const latestPdf = pdfBlocks.sort(
      (a, b) => new Date(b.created_at) - new Date(a.created_at)
    )[0];

    if (latestPdf) {
      resumeBtn.href = latestPdf.attachment.url;
    } else {
      resumeBtn.textContent = "Resume unavailable";
      resumeBtn.removeAttribute("href");
    }
  } catch (error) {
    console.error("Error fetching resume from Are.na:", error);
    resumeBtn.textContent = "Resume unavailable";
  }
}

loadResumeLink();
  </script>
