<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Product Detail</title>
  <meta name="viewport" content="initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <span class="info">
      <span class="text-frag"><a href="../../view-2/index.html"><div class="jos-choice">Josephine Jelicich Furniture</div></a></span>
      <span class="text-frag"><a href="../../about/index.html">About</a></span>
      <span class="text-frag">
        <div class="dropdown">
          <button class="dropbtn" onclick="myFunction()">
            <div class="special">q</div>Wood Work<i class="fa fa-caret-down"></i>
          </button>
          <div class="dropdown-content" id="myDropdown">
            <a href="../../personalprojects/index.html">• Personal Projects</a>
            <a href="../../specialframes/index.html">• Special Frames</a>
            <a href="../../commissions/index.html">• Commissions</a>
            <a href="../../nelson/index.html">• Nelson Carpentry School</a>
            <a href="../../warren/index.html">• The Warren</a>
          </div>
        </div>
      </span>
      <span class="text-frag"><a href="../../view-1/index.html">Day by Day</a></span>
      <span class="text-frag"><a href="../../view-2/index.html">Gallery</a></span>
      <span class="text-frag shop-nav"><a href="../index.html">Shop</a></span>
      <span class="text-frag shop-nav"><button id="cart-btn" onclick="showCart()">Cart</button></span>
    </span>
  </header>

  <section class="work-container">
    <div id="product-detail"></div>
  </section>

  <!-- Slide-out Cart HTML -->
  <div id="cart-slideout" class="cart-slideout">
    <div class="cart-header">
      <span>Cart</span>
      <button onclick="closeCart()" class="close-btn">&times;</button>
    </div>
    <div id="cart-items"></div>
    <button onclick="goToCheckout()" class="checkout-btn">Checkout</button>
  </div>
  <div id="cart-overlay" class="cart-overlay" onclick="closeCart()"></div>

  <footer>
    &copy; Josephine Jelicich 2021
  </footer>

  <script src="../../js/product.js"></script>
  <script src="../../js/drop.js"></script>
  <script src="../../js/app.js"></script>
  <script src="../../js/main.js"></script>
  <script>
    function myFunction() {
      document.getElementById("myDropdown").classList.toggle("show");
    }
    window.onclick = function(event) {
      if (!event.target.matches('.dropbtn')) {
        var dropdowns = document.getElementsByClassName("dropdown-content");
        for (var i = 0; i < dropdowns.length; i++) {
          var openDropdown = dropdowns[i];
          if (openDropdown.classList.contains('show')) {
            openDropdown.classList.remove('show');
          }
        }
      }
    }

    function showCart() {
      document.getElementById("cart-slideout").classList.add("open");
      document.getElementById("cart-overlay").classList.add("open");
      const cartItems = document.getElementById("cart-items");
      if (!cart.length) {
        cartItems.innerHTML = "<p>Your cart is empty.</p>";
      } else {
        cartItems.innerHTML = cart
          .map(
            (item, idx) => `
            <div class="cart-item">
              <div class="jos-choice">${item.title}</div><br>
              ${item.quantity} × ${item.price} ${item.currency}
              <div>
                <button onclick="updateCartQuantity(${idx}, -1)">−</button>
                <span>${item.quantity}</span>
                <button onclick="updateCartQuantity(${idx}, 1)">+</button>
                <button onclick="removeCartItem(${idx})">Remove</button>
              </div>
            </div>`
          )
          .join("");
      }
    }

    function updateCartQuantity(index, change) {
      cart[index].quantity += change;
      if (cart[index].quantity < 1) cart[index].quantity = 1;
      localStorage.setItem('cart', JSON.stringify(cart));
      showCart();
    }

    function removeCartItem(index) {
      cart.splice(index, 1);
      localStorage.setItem('cart', JSON.stringify(cart));
      showCart();
    }
  </script>
</body>
</html>
